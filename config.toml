[paths]
data_root = "data"
output_dir = "output"
cache_dir = "output/cache"
model_dir = "output/models"
metrics_dir = "output/metrics"
submission_dir = "output/submissions"
figure_dir = "output/figures"

[datasets]
dgraph_fin = "data/DGraphFin/DGraphFin1"
dgraph_fin2 = "data/DGraphFin/DGraphFin2"
ieee_cis = "data/ieee-fraud-detection"
elliptic_pp = "data/elliptic-plus-plus"
ibm_aml = "data/ibm-aml"
amlsim_sample = "data/amlsim/sample/outputs"

[training]
default_dataset = "dgraph_fin"
seed = 42
valid_size = 0.1
use_cached_features = true

[reporting]
metrics_path = "output/metrics/xgboost_metrics.json"
output_path = "output/metrics/summary.md"
importance_path = "output/figures/feature_importance.csv"
importance_output_path = "output/figures/feature_importance.md"
top_feature_count = 15

[[risk_levels]]
level = "critical"
threshold = 0.85
action = "freeze_and_manual_review"

[[risk_levels]]
level = "high"
threshold = 0.65
action = "manual_review"

[[risk_levels]]
level = "medium"
threshold = 0.35
action = "step_up_verification"

[[risk_levels]]
level = "low"
threshold = 0.0
action = "pass"

[models.graph.lightgbm]
n_estimators = 700
learning_rate = 0.05
num_leaves = 127
subsample = 0.85
colsample_bytree = 0.85
reg_lambda = 1.0
n_jobs = -1
verbose = -1

[models.graph.xgboost]
n_estimators = 500
max_depth = 8
learning_rate = 0.05
subsample = 0.85
colsample_bytree = 0.85
tree_method = "hist"
n_jobs = 8

[models.graph.blend]
xgboost_weight = 0.9
lightgbm_weight = 0.1

[models.tabular.lightgbm]
n_estimators = 900
learning_rate = 0.05
num_leaves = 255
subsample = 0.85
colsample_bytree = 0.85
reg_lambda = 1.0
n_jobs = -1
verbose = -1

[models.tabular.xgboost]
n_estimators = 700
max_depth = 10
learning_rate = 0.05
subsample = 0.85
colsample_bytree = 0.85
tree_method = "hist"
n_jobs = 8

[models.tabular.blend]
xgboost_weight = 0.8
lightgbm_weight = 0.2
