[project]
name = "dgcheater"
version = "0.1.0"
description = "DGraphFin anti-fraud competition project with uv-managed training pipeline and Typst report."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "confluent-kafka>=2.12.2",
  "fastapi>=0.124.0",
  "joblib>=1.5.2",
  "lightgbm>=4.6.0",
  "networkx>=3.6",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "requests>=2.32.5",
  "scikit-learn>=1.7.2",
  "scipy>=1.17.1",
  "typer>=0.16.1",
  "uvicorn>=0.38.0",
  "xgboost>=3.1.1",
]

[project.optional-dependencies]
report = [
  "matplotlib>=3.10.7",
]

[project.scripts]
dgcheater-train = "dgcheater.cli:app"
dgcheater-stream = "dgcheater.streaming.runtime:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
