<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf7"/>
      <stop offset="1" stop-color="#f4f1e7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f7f2e6"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243446" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L15,8 L1.5,14.5 Z" fill="#3f5368"/>
    </marker>
    <style>
      .title{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:39px;font-weight:700;fill:#182432}
      .sub{font-family:"Times New Roman","Source Han Serif SC","SimSun",serif;font-size:20px;fill:#637184}
      .lane{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:24px;font-weight:700;fill:#1f2e3d}
      .node{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:20px;font-weight:700;fill:#223244}
      .body{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:16px;fill:#4a5b6a}
      .chip{font-family:"Times New Roman","Source Han Serif SC","SimSun",serif;font-size:15px;fill:#5f6e7c}
      .line{fill:none;stroke:#3f5368;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7c8b98;stroke-width:2.2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1700" height="980" fill="url(#bg)"/>
  <text x="84" y="76" class="title">智鉴流盾技术框架与组件选型</text>
  <text x="86" y="112" class="sub">simulation · message stream · stateful computing · risk scoring · graph storage · visual review</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="1560" height="735" rx="30" fill="url(#panel)" stroke="#d9dfdf" stroke-width="2"/>
    <line x1="70" y1="275" x2="1630" y2="275" stroke="#e4e8e5" stroke-width="2"/>
    <line x1="70" y1="545" x2="1630" y2="545" stroke="#e4e8e5" stroke-width="2"/>
    <line x1="70" y1="720" x2="1630" y2="720" stroke="#e4e8e5" stroke-width="2"/>
    <text x="104" y="226" class="lane">数据与仿真层</text>
    <text x="104" y="363" class="lane">流式处理与评分层</text>
    <text x="104" y="628" class="lane">存储与图状态层</text>
    <text x="104" y="800" class="lane">接口与可视化层</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="185" width="230" height="72" rx="16" fill="#e9f2ff" stroke="#9bbfe9"/>
    <text x="318" y="217" class="node">DGraph-Fin</text>
    <text x="318" y="243" class="body">公开图交易基准</text>

    <rect x="590" y="185" width="260" height="72" rx="16" fill="#eef8ee" stroke="#9dcca3"/>
    <text x="618" y="217" class="node">多源仿真器</text>
    <text x="618" y="243" class="body">交易、设备、名单、标签</text>

    <rect x="920" y="185" width="260" height="72" rx="16" fill="#fff0dd" stroke="#e4b56d"/>
    <text x="948" y="217" class="node">欺诈剧本引擎</text>
    <text x="948" y="243" class="body">团伙、突发、跨渠道</text>

    <rect x="1250" y="185" width="250" height="72" rx="16" fill="#f2ecff" stroke="#b9a6df"/>
    <text x="1278" y="217" class="node">JSON Schema</text>
    <text x="1278" y="243" class="body">事件字段契约</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="260" y="342" width="240" height="88" rx="16" fill="#ffffff" stroke="#cfdbe6"/>
    <text x="288" y="376" class="node">Kafka</text>
    <text x="288" y="404" class="body">raw、cleaned、features</text>

    <rect x="570" y="342" width="280" height="88" rx="16" fill="#ffffff" stroke="#cfdbe6"/>
    <text x="598" y="376" class="node">Flink Keyed State</text>
    <text x="598" y="404" class="body">窗口、设备、IP、商户状态</text>

    <rect x="920" y="342" width="260" height="88" rx="16" fill="#ffffff" stroke="#cfdbe6"/>
    <text x="948" y="376" class="node">XGBoost / LightGBM</text>
    <text x="948" y="404" class="body">离线账户风险先验</text>

    <rect x="1250" y="342" width="250" height="88" rx="16" fill="#ffffff" stroke="#cfdbe6"/>
    <text x="1278" y="376" class="node">风险评分服务</text>
    <text x="1278" y="404" class="body">分数、等级、原因码</text>

    <rect x="570" y="456" width="280" height="70" rx="16" fill="#f8fbff" stroke="#b9cce2"/>
    <text x="598" y="487" class="node">动态图特征</text>
    <text x="598" y="512" class="body">邻域、组件、团伙编号</text>

    <rect x="920" y="456" width="260" height="70" rx="16" fill="#f8fbff" stroke="#b9cce2"/>
    <text x="948" y="487" class="node">规则证据</text>
    <text x="948" y="512" class="body">金额、频次、名单、设备</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="592" width="260" height="86" rx="16" fill="#ffffff" stroke="#d8d3c7"/>
    <text x="313" y="626" class="node">PostgreSQL</text>
    <text x="313" y="654" class="body">风险事件、原因、审计</text>

    <rect x="645" y="592" width="240" height="86" rx="16" fill="#ffffff" stroke="#d8d3c7"/>
    <text x="673" y="626" class="node">Redis</text>
    <text x="673" y="654" class="body">实时榜单与近期告警</text>

    <rect x="985" y="592" width="250" height="86" rx="16" fill="#ffffff" stroke="#d8d3c7"/>
    <text x="1013" y="626" class="node">Neo4j</text>
    <text x="1013" y="654" class="body">账户、设备、IP、商户图谱</text>

    <rect x="1325" y="592" width="220" height="86" rx="16" fill="#ffffff" stroke="#d8d3c7"/>
    <text x="1353" y="626" class="node">模型产物</text>
    <text x="1353" y="654" class="body">版本、特征、阈值</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="762" width="260" height="78" rx="16" fill="#edf6f4" stroke="#9fc9c2"/>
    <text x="348" y="795" class="node">FastAPI</text>
    <text x="348" y="821" class="body">风险、图谱、复核接口</text>

    <rect x="700" y="762" width="280" height="78" rx="16" fill="#fff7e8" stroke="#e2c083"/>
    <text x="728" y="795" class="node">Vue 实时大屏</text>
    <text x="728" y="821" class="body">交易监测、告警、图追溯</text>

    <rect x="1100" y="762" width="270" height="78" rx="16" fill="#f2edff" stroke="#b9a6df"/>
    <text x="1128" y="795" class="node">复核工作台</text>
    <text x="1128" y="821" class="body">确认欺诈、冻结、放行</text>
  </g>

  <path class="line" d="M850 221 C880 221 890 221 920 221"/>
  <path class="line" d="M1180 221 C1210 221 1220 221 1250 221"/>
  <path class="line" d="M720 257 C720 300 405 292 390 335"/>
  <path class="line" d="M500 386 C530 386 540 386 570 386"/>
  <path class="line" d="M850 386 C880 386 890 386 920 386"/>
  <path class="line" d="M1180 386 C1210 386 1220 386 1250 386"/>
  <path class="line" d="M710 430 L710 456"/>
  <path class="line" d="M1050 430 L1050 456"/>
  <path class="dash" d="M710 526 C760 548 970 552 1108 592"/>
  <path class="line" d="M1375 430 C1375 505 1325 538 1215 548 C970 570 650 548 420 590"/>
  <path class="line" d="M1435 678 C1435 734 1240 720 1238 762"/>
  <path class="line" d="M415 678 L450 762"/>
  <path class="line" d="M765 678 C765 725 836 718 838 762"/>
  <path class="line" d="M1110 678 C1110 725 1230 718 1232 762"/>

  <g>
    <rect x="86" y="916" width="1528" height="38" rx="14" fill="#ffffff" stroke="#d7dedc"/>
    <text x="850" y="941" text-anchor="middle" class="chip">技术选型原则：流处理承接实时性，树模型保证稳定推理，图数据库支撑团伙溯源，前端大屏服务人工研判与复核闭环。</text>
  </g>
</svg>
