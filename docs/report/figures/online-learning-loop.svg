<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f5f8f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1c2e3d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#34495e"/>
    </marker>
    <style>
      .title{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:36px;font-weight:700;fill:#162331}
      .node-title{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:23px;font-weight:700;fill:#172331}
      .node-body{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:17px;fill:#526476}
      .flow{fill:none;stroke:#34495e;stroke-width:4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7b8794;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <text x="58" y="64" class="title">自适应学习与模型迭代闭环</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="180" height="112" rx="18" fill="#e7f1ff" stroke="#8bb9eb" stroke-width="2"/>
    <text x="100" y="220" class="node-title">实时风险事件</text>
    <text x="100" y="254" class="node-body">风险分、原因码</text>

    <rect x="302" y="176" width="180" height="112" rx="18" fill="#fff0e5" stroke="#e0a76b" stroke-width="2"/>
    <text x="332" y="220" class="node-title">延迟标签</text>
    <text x="332" y="254" class="node-body">事后确认欺诈</text>

    <rect x="534" y="176" width="180" height="112" rx="18" fill="#f1edfb" stroke="#ad99df" stroke-width="2"/>
    <text x="564" y="220" class="node-title">人工复核</text>
    <text x="564" y="254" class="node-body">误报放行、冻结</text>

    <rect x="766" y="176" width="180" height="112" rx="18" fill="#e9f7ef" stroke="#8ec79c" stroke-width="2"/>
    <text x="796" y="220" class="node-title">时间切分训练</text>
    <text x="796" y="254" class="node-body">避免未来泄漏</text>

    <rect x="998" y="176" width="180" height="112" rx="18" fill="#fdecec" stroke="#dc8d8d" stroke-width="2"/>
    <text x="1028" y="220" class="node-title">影子评估</text>
    <text x="1028" y="254" class="node-body">召回、误报、延迟</text>
  </g>

  <path class="flow" d="M250 232 L302 232"/>
  <path class="flow" d="M482 232 L534 232"/>
  <path class="flow" d="M714 232 L766 232"/>
  <path class="flow" d="M946 232 L998 232"/>
  <path class="dash" d="M1088 288 L1088 380 L160 380 L160 288"/>

  <g filter="url(#shadow)">
    <rect x="432" y="360" width="420" height="70" rx="18" fill="#ffffff" stroke="#ccd7e1" stroke-width="2"/>
    <text x="488" y="404" class="node-title">模型版本切换与回滚</text>
    <text x="710" y="404" class="node-body">阈值达标上线，异常时回退稳定版本</text>
  </g>
</svg>
