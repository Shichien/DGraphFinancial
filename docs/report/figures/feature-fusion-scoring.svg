<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f4f7f8"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#22364b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1.5,1.5 L11,6.5 L1.5,11.5 Z" fill="#40566e"/>
    </marker>
    <style>
      .title{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:34px;font-weight:700;fill:#182534}
      .card{fill:#fff;stroke:#dce5ee;stroke-width:2}
      .h{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:22px;font-weight:700;fill:#1f2e3d}
      .t{font-family:"Source Han Serif SC","SimSun","Times New Roman",serif;font-size:17px;fill:#3d4f61}
      .s{font-family:"Times New Roman","Source Han Serif SC","SimSun",serif;font-size:16px;fill:#667789}
      .w{font-family:"Times New Roman","Source Han Serif SC","SimSun",serif;font-size:21px;font-weight:700;fill:#16324d}
      .line{fill:none;stroke:#40566e;stroke-width:3.5;marker-end:url(#arrow)}
      .thin{fill:none;stroke:#93a0ad;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="82" y="76" class="title">多维特征融合与风险评分机制</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="320" height="145" rx="18" class="card"/>
    <rect x="70" y="170" width="320" height="12" rx="6" fill="#6d9ed6"/>
    <text x="102" y="218" class="h">离线图模型先验</text>
    <text x="102" y="253" class="t">DGraph-Fin 节点属性、交易边</text>
    <text x="102" y="281" class="t">一跳邻域、时间跨度、交易类型</text>

    <rect x="70" y="365" width="320" height="145" rx="18" class="card"/>
    <rect x="70" y="365" width="320" height="12" rx="6" fill="#74b483"/>
    <text x="102" y="413" class="h">实时行为特征</text>
    <text x="102" y="448" class="t">1 分钟次数、5 分钟金额</text>
    <text x="102" y="476" class="t">对手方数量、渠道切换、突发强度</text>

    <rect x="70" y="560" width="320" height="145" rx="18" class="card"/>
    <rect x="70" y="560" width="320" height="12" rx="6" fill="#c89bdc"/>
    <text x="102" y="608" class="h">异构图团伙特征</text>
    <text x="102" y="643" class="t">账户、设备、IP、商户关系</text>
    <text x="102" y="671" class="t">一跳邻居、二跳组件、风险邻居</text>

    <rect x="70" y="755" width="320" height="120" rx="18" class="card"/>
    <rect x="70" y="755" width="320" height="12" rx="6" fill="#e2a561"/>
    <text x="102" y="803" class="h">规则与名单证据</text>
    <text x="102" y="838" class="t">大额异常、黑名单命中、商户集中</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="255" width="360" height="520" rx="26" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
    <text x="585" y="310" class="h">统一特征向量</text>
    <line x1="560" y1="335" x2="840" y2="335" stroke="#dce5ee" stroke-width="2"/>
    <text x="565" y="382" class="t">账户风险先验</text>
    <text x="792" y="382" text-anchor="end" class="s">126 维图特征</text>
    <text x="565" y="430" class="t">交易窗口行为</text>
    <text x="792" y="430" text-anchor="end" class="s">次数、金额、间隔</text>
    <text x="565" y="478" class="t">设备与 IP 指纹</text>
    <text x="792" y="478" text-anchor="end" class="s">复用与聚集</text>
    <text x="565" y="526" class="t">动态图邻域</text>
    <text x="792" y="526" text-anchor="end" class="s">邻居与团伙</text>
    <text x="565" y="574" class="t">商户与名单情报</text>
    <text x="792" y="574" text-anchor="end" class="s">收单与命中</text>
    <text x="565" y="650" class="h">泄漏控制</text>
    <text x="565" y="686" class="t">在线评分不读取仿真欺诈标签</text>
    <text x="565" y="718" class="t">图邻域标签只使用训练折可见信息</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="210" width="530" height="175" rx="24" fill="#f9fbff" stroke="#cad8e6" stroke-width="2"/>
    <text x="1042" y="262" class="h">融合评分公式</text>
    <text x="1042" y="318" class="w">S = 0.45 P<tspan baseline-shift="sub" font-size="14">offline</tspan> + 0.30 P<tspan baseline-shift="sub" font-size="14">behavior</tspan> + 0.15 P<tspan baseline-shift="sub" font-size="14">graph</tspan> + 0.10 P<tspan baseline-shift="sub" font-size="14">rule</tspan></text>
    <text x="1042" y="352" class="s">四类分数同时写入证据字段</text>
    <text x="1042" y="374" class="s">前端解释面板与后端评分口径一致</text>

    <rect x="1000" y="450" width="530" height="175" rx="24" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
    <text x="1042" y="502" class="h">风险等级与业务动作</text>
    <g>
      <rect x="1042" y="535" width="88" height="42" rx="12" fill="#dff2e6" stroke="#8fc79e"/>
      <text x="1086" y="563" text-anchor="middle" class="t">低危</text>
      <rect x="1162" y="535" width="88" height="42" rx="12" fill="#fff0cc" stroke="#e0bd66"/>
      <text x="1206" y="563" text-anchor="middle" class="t">中危</text>
      <rect x="1282" y="535" width="88" height="42" rx="12" fill="#ffe0c8" stroke="#e7a36f"/>
      <text x="1326" y="563" text-anchor="middle" class="t">高危</text>
      <rect x="1402" y="535" width="88" height="42" rx="12" fill="#f7d4d4" stroke="#d98989"/>
      <text x="1446" y="563" text-anchor="middle" class="t">严重</text>
    </g>
    <text x="1042" y="606" class="s">放行、加强验证、人工复核、冻结拦截</text>

    <rect x="1000" y="690" width="530" height="145" rx="24" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
    <text x="1042" y="742" class="h">可解释输出</text>
    <text x="1042" y="778" class="t">风险分、等级、处置动作、原因码、团伙编号</text>
    <text x="1042" y="810" class="t">相关节点与关联边，用于研判、调优和审计追踪</text>
  </g>

  <path d="M390 242 L455 242" fill="none" stroke="#40566e" stroke-width="3.2"/>
  <path d="M390 438 L455 438" fill="none" stroke="#40566e" stroke-width="3.2"/>
  <path d="M390 633 L455 633" fill="none" stroke="#40566e" stroke-width="3.2"/>
  <path d="M390 815 L455 815" fill="none" stroke="#40566e" stroke-width="3.2"/>
  <path d="M455 242 L455 815" fill="none" stroke="#40566e" stroke-width="3.2"/>
  <circle cx="455" cy="242" r="5" fill="#40566e"/>
  <circle cx="455" cy="438" r="5" fill="#40566e"/>
  <circle cx="455" cy="633" r="5" fill="#40566e"/>
  <circle cx="455" cy="815" r="5" fill="#40566e"/>
  <path class="line" d="M455 515 L520 515"/>
  <path class="line" d="M880 515 L940 515 L940 295 L1000 295"/>
  <path class="line" d="M1265 385 L1265 450"/>
  <path class="thin" d="M1265 625 L1265 690"/>
</svg>
