services:
  postgres:
    image: postgres:16-alpine
    container_name: dgcheater-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dgcheater
      POSTGRES_PASSWORD: dgcheater
      POSTGRES_DB: dgcheater
    volumes:
      - dgcheater-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgcheater -d dgcheater"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    container_name: dgcheater-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: dgcheater-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dgcheater-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: dgcheater-kafka-init
    depends_on:
      - kafka
    command:
      - bash
      - -lc
      - |
        set -e
        for i in {1..60}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.risk --partitions 1 --replication-factor 1

  risk-scorer:
    build:
      context: ../..
      dockerfile: deploy/streaming/Dockerfile
    container_name: dgcheater-risk-scorer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DGC_DATASET: dgraph_fin
      DGC_DATA_PATH: /app/data/DGraphFin/DGraphFin1
      DGC_OUTPUT_DIR: /app/output
      DGC_BATCH_SIZE: 256
      DGC_DATABASE_URL: postgresql://dgcheater:dgcheater@postgres:5432/dgcheater
    volumes:
      - ../../data:/app/data:ro
      - ../../output:/app/output
    command: ["dgcheater-stream", "serve-scorer", "--host", "0.0.0.0", "--port", "8000"]

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: dgcheater-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      NO_PROXY: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
      no_proxy: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
    command: jobmanager
    volumes:
      - ./flink:/opt/dgcheater/flink

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: dgcheater-flink-taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      NO_PROXY: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
      no_proxy: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
    command: taskmanager

  flink-risk-job:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: dgcheater-flink-risk-job
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      risk-scorer:
        condition: service_started
      flink-jobmanager:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DGC_INPUT_TOPIC: transactions.raw
      DGC_OUTPUT_TOPIC: transactions.risk
      DGC_SCORER_URL: http://risk-scorer:8000/score-batch
      DGC_BATCH_SIZE: 256
      NO_PROXY: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
      no_proxy: localhost,127.0.0.1,::1,kafka,risk-scorer,flink-jobmanager,flink-taskmanager
    volumes:
      - ./flink:/opt/dgcheater/flink
    command:
      - bash
      - -lc
      - |
        echo "Waiting for JobManager and scorer..."
        sleep 20
        flink run -m flink-jobmanager:8081 -py /opt/dgcheater/flink/risk_job.py

  producer:
    build:
      context: ../..
      dockerfile: deploy/streaming/Dockerfile
    container_name: dgcheater-producer
    profiles:
      - tools
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DGC_DATASET: dgraph_fin
      DGC_DATA_PATH: /app/data/DGraphFin/DGraphFin1
      DGC_OUTPUT_DIR: /app/output
      DGC_INPUT_TOPIC: transactions.raw
      DGC_EVENT_COUNT: 5000
      DGC_REPLAY_INTERVAL_MS: 0
    volumes:
      - ../../data:/app/data:ro
      - ../../output:/app/output
    command: ["dgcheater-stream", "produce"]

  result-consumer:
    build:
      context: ../..
      dockerfile: deploy/streaming/Dockerfile
    container_name: dgcheater-result-consumer
    profiles:
      - tools
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DGC_OUTPUT_TOPIC: transactions.risk
      DGC_DATABASE_URL: postgresql://dgcheater:dgcheater@postgres:5432/dgcheater
    volumes:
      - ../../output:/app/output
    command:
      - dgcheater-stream
      - consume-results
      - --output-path
      - /app/output/streaming/kafka_risk_events.jsonl
      - --max-messages
      - "5000"
      - --timeout-seconds
      - "120"

  live-dashboard:
    build:
      context: ../..
      dockerfile: deploy/streaming/Dockerfile
    container_name: dgcheater-live-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8050"
    environment:
      DGC_OUTPUT_DIR: /app/output
      DGC_DATABASE_URL: postgresql://dgcheater:dgcheater@postgres:5432/dgcheater
    volumes:
      - ../../output:/app/output
    command: ["dgcheater-stream", "serve-dashboard", "--host", "0.0.0.0", "--port", "8050"]

volumes:
  dgcheater-postgres-data:
