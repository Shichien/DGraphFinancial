[project]
name = "Cheater-Recognition"
version = "0.1.0"
description = "Check anomaly detection in DGraph-Fin dataset"
readme = "README.md"
requires-python = "==3.11.13"
dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "setuptools>=80.9.0",
    "torch>=2.9.1",
    "torch-geometric>=2.7.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "xgboost>=3.1.1",
    "xxhash>=3.6.0",
]

[tool.uv.extra-build-dependencies]
"torch-sparse" = ["torch"]
"torch-geometric" = ["torch"]
"torch-scatter" = ["torch"]

[tool.uv.pip]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = [
    "https://data.pyg.org/whl/torch-2.8.0+cu128", 
    "https://download.pytorch.org/whl/cu121", 
]
